<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="세계여행 지도" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;" />
  <title>세계여행 지도</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #162033;
      --border: #2b3b57;
      --text: #f8fafc;
      --muted: #94a3b8;
      --planned: #3b82f6;
      --planned-stroke: #93c5fd;
      --city-red: #ef4444;
      --land: #1e293b;
      --land-stroke: #334155;
      --ocean: #070d19;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background: rgba(22, 32, 51, 0.96);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top) + 7px) 12px 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .brand h1 { margin: 0; font-size: 14.5px; font-weight: 700; }
    .stats { font-size: 11px; color: #6ee7b7; margin-top: 2px; font-weight: 600; }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      background: #24334d;
      color: var(--text);
      border: 1px solid #3b5075;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #10b981; color: #052e16; border-color: #10b981; }
    button.blue-btn { background: #2563eb; color: #eff6ff; border-color: #3b82f6; }
    button:active { opacity: 0.8; }

    .filter-strip {
      background: #111929;
      border-bottom: 1px solid var(--border);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      z-index: 19;
      flex-wrap: wrap;
    }
    .seg-group { display: flex; gap: 4px; }
    .seg-group button { padding: 4px 8px; font-size: 11px; }
    .seg-group button.active-all { background: #334155; border-color: #94a3b8; color: #fff; }
    .seg-group button.active-visited { background: #059669; border-color: #34d399; color: #ecfdf5; }
    .seg-group button.active-planned { background: #2563eb; border-color: #60a5fa; color: #eff6ff; }
    .legend { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10.5px; }
    .dot-sample { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; vertical-align: middle; }

    #map-wrap { flex: 1; position: relative; background: var(--ocean); overflow: hidden; touch-action: none; }
    svg { width: 100%; height: 100%; display: block; }
    .country { fill: var(--land); stroke: var(--land-stroke); stroke-width: 0.5px; }
    .country-label {
      fill: rgba(248, 250, 252, 0.88);
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 2px #000;
      pointer-events: none;
    }
    .city-marker { cursor: pointer; }
    .city-dot { fill: var(--city-red); stroke: #fff; }
    .city-badge { fill: var(--city-red); stroke: #fff; }
    .city-count {
      fill: #fff;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .city-label {
      fill: #fef08a;
      font-weight: 600;
      text-shadow: 0 1px 3px #000, 0 0 2px #000;
      pointer-events: none;
    }

    .bottom-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 15;
    }
    .bottom-bar > * { pointer-events: auto; }
    .pill {
      display: flex;
      background: rgba(22, 32, 51, 0.94);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .pill button { border: none; background: transparent; padding: 5px 9px; border-radius: 6px; }
    .pill button.active { background: #10b981; color: #052e16; }

    #info-box {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(11, 17, 32, 0.94);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      max-width: 270px;
      display: none;
      z-index: 18;
    }
    #status-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .modal-body { padding: 12px 14px; overflow-y: auto; font-size: 12.5px; line-height: 1.5; }
    label { display: block; margin-top: 8px; color: #cbd5e1; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: #0b1120;
      color: var(--text);
      border: 1px solid #3b5075;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-family: inherit;
      margin-top: 4px;
    }
    textarea { height: 150px; resize: vertical; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    .row > button { flex: 1; padding: 9px; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #26354f;
      gap: 8px;
    }
    .tag-v { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
    .tag-p { background: rgba(59, 130, 246, 0.22); color: #93c5fd; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>세계여행 지도</h1>
    <div class="stats" id="stats">방문 0개국 · 예정 0개국 · 도시 0곳</div>
  </div>
  <div class="btn-row">
    <button class="primary" onclick="openModal('add-modal')">+ 기록</button>
    <button onclick="openModal('numbers-modal')">Numbers</button>
    <button onclick="openModal('backup-modal')">백업/목록</button>
  </div>
</header>

<div class="filter-strip">
  <div class="seg-group">
    <button id="f-all" class="active-all" onclick="setFilter('all')">전체</button>
    <button id="f-visited" onclick="setFilter('visited')">방문한 나라</button>
    <button id="f-planned" onclick="setFilter('planned')">가려고 하는 나라</button>
  </div>
  <div class="legend">
    <span><i class="dot-sample" style="background:#10b981;"></i>방문(횟수↑ 진함)</span>
    <span><i class="dot-sample" style="background:#3b82f6;"></i>예정</span>
    <span><i class="dot-sample" style="background:#ef4444;"></i>도시 1회 / 숫자 2회+</span>
  </div>
</div>

<div id="map-wrap">
  <div id="status-msg">세계지도 경계 데이터를 불러오는 중입니다...<br>(최초 1회 로드 후 브라우저에 캐시됩니다)</div>
  <div id="info-box"></div>
  <svg id="svg-map"></svg>

  <div class="bottom-bar">
    <div class="pill">
      <button id="m-2d" class="active" onclick="setMode('2d')">세계지도</button>
      <button id="m-3d" onclick="setMode('3d')">지구본</button>
    </div>
    <div class="pill">
      <button id="btn-lbl" onclick="toggleLabels()">도시명 ON</button>
      <button onclick="resetCamera()">초기화</button>
    </div>
  </div>
</div>

<!-- 기록 추가 모달 -->
<div class="backdrop" id="add-modal">
  <div class="modal">
    <div class="modal-head">
      <span>여행 기록 추가</span>
      <button onclick="closeModal('add-modal')">닫기</button>
    </div>
    <div class="modal-body">
      <label>국가명 (한글 또는 영문)</label>
      <input type="text" id="in-country" />
      <label>도시 (쉼표로 구분 · 한 여행 여러 도시는 국가 1회로 집계 · 예정국은 선택)</label>
      <input type="text" id="in-cities" />
      <label>구분</label>
      <select id="in-status">
        <option value="방문">방문</option>
        <option value="예정">예정</option>
      </select>
      <label>메모 (선택 · 예: 2026 가을)</label>
      <input type="text" id="in-note" />
      <div class="row">
        <button class="primary" onclick="addRecord()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- Numbers 연동 모달 -->
<div class="backdrop" id="numbers-modal">
  <div class="modal">
    <div class="modal-head">
      <span>Apple Numbers 가져오기 · 내려받기</span>
      <button onclick="closeModal('numbers-modal')">닫기</button>
    </div>
    <div class="modal-body">
      <div>형식: <b>국가 | 도시(쉼표 구분) | 구분(방문/예정) | 메모</b><br>동일 기록은 자동 중복 방지됩니다.</div>
      <textarea id="numbers-io">국가	도시	구분	메모</textarea>
      <div class="row">
        <button class="primary" onclick="importNumbers(false)">중복 제외하고 추가</button>
        <button onclick="importNumbers(true)">전체 덮어쓰기</button>
      </div>
      <div class="row">
        <button onclick="exportNumbersToBox()">현재 기록을 Numbers 포맷으로 불러오기</button>
        <button onclick="copyNumbersBox()">복사</button>
      </div>
    </div>
  </div>
</div>

<!-- iCloud JSON 백업 및 목록 모달 -->
<div class="backdrop" id="backup-modal">
  <div class="modal">
    <div class="modal-head">
      <span>iCloud JSON 백업 · 기록 목록</span>
      <button onclick="closeModal('backup-modal')">닫기</button>
    </div>
    <div class="modal-body">
      <div class="row">
        <button class="blue-btn" onclick="exportJsonFile()">JSON 백업 저장</button>
        <button onclick="document.getElementById('json-input').click()">JSON 복원</button>
        <input type="file" id="json-input" accept=".json,application/json" style="display:none" onchange="importJsonFile(event)" />
      </div>
      <div id="records-list" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

  "퀸스타운":[168.662,-45.031],"카이로":[31.235,30.044],"카사블랑카":[-7.589,33.573],"케이프타운":[18.424,-33.924],
  "리우데자네이루":[-43.172,-22.906],"상파울루":[-46.633,-23.550],"부에노스아이레스":[-58.381,-34.603],"리마":[-77.042,-12.046],
  "쿠스코":[-71.967,-13.531],"산티아고":[-70.669,-33.448],"칸쿤":[-86.851,21.161]
};

const DATA_KEY = "wtm_records_v2";
const ATLAS_KEY = "wtm_atlas_110m_v1";

let records = JSON.parse(localStorage.getItem(DATA_KEY)) || [];
let worldFeatures = null;
let filterMode = "all"; // 'all' | 'visited' | 'planned'
let viewMode = "2d";    // '2d' | '3d'
let showLabels = true;
let scaleFactor = 1;
let globeRotate = [0, -15];

const svg = d3.select("#svg-map");
const gRoot = svg.append("g");
const gLand = gRoot.append("g");
const gCountryLabels = gRoot.append("g");
const gCities = gRoot.append("g");
let projection, geoPath;

function resolveIso(name) {
  if (!name) return null;
  const k = name.trim().toLowerCase();
  if (COUNTRY_ISO[k]) return COUNTRY_ISO[k];
  if (worldFeatures) {
    const f = worldFeatures.find(x => x.properties && x.properties.name && x.properties.name.toLowerCase() === k);
    if (f) return String(f.id).padStart(3, "0");
  }
  return null;
}

function resolveCoords(city, iso) {
  const k = city.trim().toLowerCase();
  if (CITY_LONLAT[k]) return CITY_LONLAT[k];
  if (worldFeatures && iso) {
    const f = worldFeatures.find(x => String(x.id).padStart(3, "0") === iso);
    if (f) return d3.geoCentroid(f);
  }
  return null;
}

function normalizeStatus(raw) {
  const s = (raw || "").trim().toLowerCase();
  if (s === "예정" || s === "planned" || s === "future" || s === "방문예정") return "예정";
  return "방문";
}

function recordSignature(r) {
  const iso = r.iso || resolveIso(r.country) || "";
  const st = normalizeStatus(r.status);
  const citiesSorted = Array.from(new Set((r.cities || []).map(c => c.trim().toLowerCase()).filter(Boolean))).sort().join(",");
  const noteNorm = (r.note || "").trim().toLowerCase();
  return `${iso}|${st}|${citiesSorted}|${noteNorm}`;
}

function computeAggregations() {
  const visitCountByIso = new Map();
  const plannedIsos = new Set();
  const cityCountMap = new Map();

  records.forEach(r => {
    const iso = r.iso || resolveIso(r.country);
    const st = normalizeStatus(r.status);
    if (!iso) return;

    if (st === "방문") {
      visitCountByIso.set(iso, (visitCountByIso.get(iso) || 0) + 1);
      const uniqueCitiesInTrip = Array.from(new Set((r.cities || []).map(c => c.trim()).filter(Boolean)));
      uniqueCitiesInTrip.forEach(city => {
        const coords = resolveCoords(city, iso);
        if (!coords) return;
        const ck = `${iso}__${city.toLowerCase()}`;
        const prev = cityCountMap.get(ck);
        if (prev) {
          prev.count += 1;
        } else {
          cityCountMap.set(ck, { city, iso, count: 1, coords });
        }
      });
    } else {
      plannedIsos.add(iso);
    }
  });

  return { visitCountByIso, plannedIsos, cityMarkers: Array.from(cityCountMap.values()) };
}

function getVisitedColor(count) {
  const clamped = Math.min(Math.max(count, 1), 6);
  const t = (clamped - 1) / 5;
  return d3.interpolateRgb("#6ee7b7", "#047857")(t);
}

function saveAndRender() {
  localStorage.setItem(DATA_KEY, JSON.stringify(records));
  renderAll();
}

async function init() {
  try {
    let topo = JSON.parse(localStorage.getItem(ATLAS_KEY));
    if (!topo) {
      const resp = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
      topo = await resp.json();
      try { localStorage.setItem(ATLAS_KEY, JSON.stringify(topo)); } catch (_) {}
    }
    const rawFeatures = topojson.feature(topo, topo.objects.countries).features;
    // 남극 제외하여 지도가 화면을 더 크게 채우도록 구성
    worldFeatures = rawFeatures.filter(f => String(f.id).padStart(3, "0") !== "010");
    document.getElementById("status-msg").style.display = "none";
    bindGestures();
    renderAll();
  } catch (e) {
    document.getElementById("status-msg").innerHTML =
      "최초 실행 시 지도 경계 데이터를 불러오기 위해 인터넷 연결이 필요합니다.<br>연결 후 새로고침하시면 이후 브라우저에 캐시됩니다.";
  }
}

function updateProjection() {
  const w = document.getElementById("map-wrap").clientWidth;
  const h = document.getElementById("map-wrap").clientHeight;
  if (viewMode === "2d") {
    const baseScale = Math.max(w / 4.4, h / 2.6);
    projection = d3.geoNaturalEarth1()
      .scale(baseScale)
      .translate([w / 2, h * 0.54]);
  } else {
    projection = d3.geoOrthographic()
      .scale(Math.min(w, h) * 0.48 * scaleFactor)
      .translate([w / 2, h / 2])
      .rotate(globeRotate)
      .clipAngle(90);
  }
  geoPath = d3.geoPath().projection(projection);
}

function renderAll() {
  if (!worldFeatures) return;
  updateProjection();

  const { visitCountByIso, plannedIsos, cityMarkers } = computeAggregations();

  document.getElementById("stats").textContent =
    `방문 ${visitCountByIso.size}개국 · 예정 ${plannedIsos.size}개국 · 도시 ${cityMarkers.length}곳`;

  const landSel = gLand.selectAll("path.country").data(worldFeatures, d => d.id);
  landSel.enter()
    .append("path")
    .attr("class", "country")
    .merge(landSel)
    .attr("d", geoPath)
    .style("stroke-width", viewMode === "2d" ? `${Math.max(0.15, 0.55 / Math.sqrt(scaleFactor))}px` : "0.5px")
    .style("fill", d => {
      const iso = String(d.id).padStart(3, "0");
      const vCount = visitCountByIso.get(iso) || 0;
      const isPlanned = plannedIsos.has(iso);

      if (filterMode === "visited") return vCount > 0 ? getVisitedColor(vCount) : "var(--land)";
      if (filterMode === "planned") return isPlanned ? "var(--planned)" : "var(--land)";
      if (vCount > 0) return getVisitedColor(vCount);
      if (isPlanned) return "var(--planned)";
      return "var(--land)";
    })
    .style("stroke", d => {
      const iso = String(d.id).padStart(3, "0");
      const vCount = visitCountByIso.get(iso) || 0;
      const isPlanned = plannedIsos.has(iso);
      if (filterMode === "visited" && vCount > 0) return "#a7f3d0";
      if (filterMode === "planned" && isPlanned) return "var(--planned-stroke)";
      if (filterMode === "all") {
        if (vCount > 0) return "#a7f3d0";
        if (isPlanned) return "var(--planned-stroke)";
      }
      return "var(--land-stroke)";
    })
    .on("click", (_, d) => {
      const iso = String(d.id).padStart(3, "0");
      const matched = records.filter(r => (r.iso || resolveIso(r.country)) === iso);
      const box = document.getElementById("info-box");
      if (matched.length === 0) {
        box.style.display = "none";
        return;
      }
      const vCnt = visitCountByIso.get(iso) || 0;
      const stText = vCnt > 0 ? `방문 ${vCnt}회` : "방문 예정";
      const cities = Array.from(new Set(matched.flatMap(m => m.cities || []))).join(", ") || "-";
      const notes = matched.map(m => m.note).filter(Boolean).join(" / ");
      box.innerHTML = `<b>${matched[0].country}</b> · <span style="color:#6ee7b7">${stText}</span><br>도시: ${cities}${notes ? `<br><span style="color:#94a3b8">${notes}</span>` : ""}`;
      box.style.display = "block";
    });

  // 확대할 때만 모든 국가명(영문)을 지도에 비례 축소 표시
  const zoomRatio = viewMode === "2d" ? scaleFactor : 1;
  const showCountryNames = zoomRatio >= 1.8;
  const namedFeatures = showCountryNames
    ? worldFeatures.filter(f => f.properties && f.properties.name)
    : [];

  const cLblSel = gCountryLabels.selectAll("text.country-label").data(namedFeatures, d => d.id);
  cLblSel.exit().remove();
  const cLblMerged = cLblSel.enter().append("text").attr("class", "country-label").merge(cLblSel);

  cLblMerged.each(function(d) {
    const centroid = d3.geoCentroid(d);
    const pt = projection(centroid);
    let visible = !!pt;
    if (viewMode === "3d") {
      visible = d3.geoDistance(centroid, [-globeRotate[0], -globeRotate[1]]) < Math.PI / 2;
    }
    const el = d3.select(this);
    if (!visible) {
      el.style("display", "none");
      return;
    }
    // 확대될수록 글자가 작아지도록 비율 조정
    const cFontSize = Math.max(2.2, 8.5 / Math.pow(zoomRatio, 0.72));
    el.style("display", "block")
      .attr("x", pt[0])
      .attr("y", pt[1])
      .style("font-size", `${cFontSize}px`)
      .text(d.properties.name);
  });

  // 도시 마커 렌더링 (중복 없이 갱신)
  const activeCities = filterMode === "planned" ? [] : cityMarkers;
  const citySel = gCities.selectAll("g.city-marker").data(activeCities, d => `${d.iso}__${d.city.toLowerCase()}`);
  citySel.exit().remove();

  const cityEnter = citySel.enter().append("g").attr("class", "city-marker");
  cityEnter.append("circle");
  cityEnter.append("text").attr("class", "city-count");
  cityEnter.append("text").attr("class", "city-label");

  const cityMerged = cityEnter.merge(citySel);
  cityMerged.each(function(d) {
    const pt = projection(d.coords);
    let visible = !!pt;
    if (viewMode === "3d") {
      visible = d3.geoDistance(d.coords, [-globeRotate[0], -globeRotate[1]]) < Math.PI / 2;
    }
    const g = d3.select(this);
    if (!visible) {
      g.style("display", "none");
      return;
    }
    g.style("display", "block").attr("transform", `translate(${pt[0]}, ${pt[1]})`);

    const isMulti = d.count >= 2;
    // 확대할수록 점·배지·도시명이 작아져 좁은 영토를 덮지 않도록 비율 축소
    const r = viewMode === "2d"
      ? Math.max(1.1, (isMulti ? 5.2 : 3.0) / Math.pow(scaleFactor, 0.68))
      : (isMulti ? 6.5 : 3.8);
    const strokeW = viewMode === "2d" ? Math.max(0.35, 1.1 / Math.pow(scaleFactor, 0.6)) : 1.1;
    const badgeFont = viewMode === "2d" ? Math.max(1.6, 7.5 / Math.pow(scaleFactor, 0.72)) : 9;
    // 기본 상태(scaleFactor < 1.5)에서는 도시명 숨김, 확대 시 비율에 맞춰 작게 표시
    const canShowCityLabel = showLabels && (viewMode === "3d" || scaleFactor >= 1.5);
    const lblFont = viewMode === "2d" ? Math.max(1.8, 7.2 / Math.pow(scaleFactor, 0.72)) : 9;

    g.select("circle")
      .attr("class", isMulti ? "city-badge" : "city-dot")
      .attr("r", r)
      .style("stroke-width", `${strokeW}px`);

    g.select("text.city-count")
      .text(isMulti ? String(d.count) : "")
      .style("font-size", `${badgeFont}px`);

    g.select("text.city-label")
      .text(canShowCityLabel ? d.city : "")
      .attr("x", r + Math.max(1.2, 2.8 / Math.pow(scaleFactor, 0.65)))
      .attr("y", 1.5)
      .style("font-size", `${lblFont}px`);
  });
}

function bindGestures() {
  const zoom = d3.zoom().scaleExtent([1, 40]).on("zoom", (ev) => {
    if (viewMode === "2d") {
      scaleFactor = ev.transform.k;
      gRoot.attr("transform", ev.transform);
      renderAll();
    }
  });
  const drag = d3.drag().on("drag", (ev) => {
    if (viewMode === "3d") {
      globeRotate = [
        globeRotate[0] + ev.dx * 0.35,
        Math.max(-85, Math.min(85, globeRotate[1] - ev.dy * 0.35))
      ];
      renderAll();
    }
  });
  svg.call(zoom).call(drag);
}

function setFilter(mode) {
  filterMode = mode;
  document.getElementById("f-all").className = mode === "all" ? "active-all" : "";
  document.getElementById("f-visited").className = mode === "visited" ? "active-visited" : "";
  document.getElementById("f-planned").className = mode === "planned" ? "active-planned" : "";
  document.getElementById("info-box").style.display = "none";
  renderAll();
}

function setMode(m) {
  viewMode = m;
  document.getElementById("m-2d").classList.toggle("active", m === "2d");
  document.getElementById("m-3d").classList.toggle("active", m === "3d");
  resetCamera();
}

function resetCamera() {
  scaleFactor = 1;
  globeRotate = [0, -15];
  gRoot.attr("transform", null);
  svg.call(d3.zoom().transform, d3.zoomIdentity);
  renderAll();
}

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById("btn-lbl").textContent = showLabels ? "도시명 ON" : "도시명 OFF";
  renderAll();
}

function openModal(id) {
  if (id === "backup-modal") renderRecordsList();
  document.getElementById(id).style.display = "flex";
}
function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

function addRecord() {
  const country = document.getElementById("in-country").value.trim();
  if (!country) return;
  const iso = resolveIso(country);
  if (!iso) {
    alert("국가명을 인식하지 못했습니다. 한글 또는 영문 국가명을 확인해 주세요.");
    return;
  }
  const cities = document.getElementById("in-cities").value.split(",").map(s => s.trim()).filter(Boolean);
  const status = normalizeStatus(document.getElementById("in-status").value);
  const note = document.getElementById("in-note").value.trim();
  const item = { country, iso, cities, status, note };

  if (!records.some(r => recordSignature(r) === recordSignature(item))) {
    records.push(item);
  }
  document.getElementById("in-country").value = "";
  document.getElementById("in-cities").value = "";
  document.getElementById("in-note").value = "";
  saveAndRender();
  closeModal("add-modal");
}

function importNumbers(overwrite) {
  const raw = document.getElementById("numbers-io").value.trim();
  if (!raw) return;
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  const nextList = [];

  lines.forEach(line => {
    const cols = line.includes("\t") ? line.split("\t") : line.split("|");
    const country = (cols[0] || "").trim();
    if (!country || country === "국가" || country === "국가명") return;
    const iso = resolveIso(country);
    if (!iso) return;
    const cities = (cols[1] || "").split(/[,/]/).map(s => s.trim()).filter(Boolean);
    const status = normalizeStatus(cols[2]);
    const note = (cols[3] || "").trim();
    nextList.push({ country, iso, cities, status, note });
  });

  if (overwrite) {
    const seen = new Set();
    records = nextList.filter(item => {
      const sig = recordSignature(item);
      if (seen.has(sig)) return false;
      seen.add(sig);
      return true;
    });
  } else {
    const existingSigs = new Set(records.map(recordSignature));
    nextList.forEach(item => {
      const sig = recordSignature(item);
      if (!existingSigs.has(sig)) {
        existingSigs.add(sig);
        records.push(item);
      }
    });
  }

  saveAndRender();
  closeModal("numbers-modal");
  alert("반영이 완료되었습니다. (중복 행은 자동 제외)");
}

function exportNumbersToBox() {
  const header = "국가\t도시\t구분\t메모";
  const rows = records.map(r =>
    `${r.country}\t${(r.cities || []).join(", ")}\t${normalizeStatus(r.status)}\t${r.note || ""}`
  );
  document.getElementById("numbers-io").value = [header, ...rows].join("\n");
}

function copyNumbersBox() {
  const txt = document.getElementById("numbers-io").value;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => alert("복사되었습니다. Numbers 표에 붙여넣으세요."));
}

function renderRecordsList() {
  const box = document.getElementById("records-list");
  if (records.length === 0) {
    box.innerHTML = "<div style='color:#94a3b8; text-align:center; padding:18px;'>저장된 여행 기록이 없습니다.</div>";
    return;
  }
  box.innerHTML = records.map((r, idx) => {
    const st = normalizeStatus(r.status);
    const badge = st === "방문" ? `<span class="tag-v">방문</span>` : `<span class="tag-p">예정</span>`;
    return `
      <div class="item-row">
        <div>
          <div><b>${r.country}</b> ${badge} <span style="color:#94a3b8; font-size:11px;">${r.note || ""}</span></div>
          <div style="color:#cbd5e1; font-size:11.5px; margin-top:2px;">${(r.cities || []).join(", ") || "도시 미입력"}</div>
        </div>
        <button style="background:#7f1d1d; border-color:#991b1b;" onclick="removeRecord(${idx})">삭제</button>
      </div>
    `;
  }).join("");
}

function removeRecord(idx) {
  records.splice(idx, 1);
  saveAndRender();
  renderRecordsList();
}

function exportJsonFile() {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `world-map-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJsonFile(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed)) throw new Error();
      records = parsed.map(x => ({
        country: String(x.country || "").trim(),
        iso: x.iso || resolveIso(x.country),
        cities: Array.isArray(x.cities) ? x.cities : [],
        status: normalizeStatus(x.status),
        note: String(x.note || "").trim()
      })).filter(x => x.country && x.iso);
      saveAndRender();
      renderRecordsList();
      alert("JSON 백업에서 복원되었습니다.");
    } catch (_) {
      alert("올바른 JSON 백업 파일이 아닙니다.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

window.addEventListener("resize", renderAll);
init();
</script>
